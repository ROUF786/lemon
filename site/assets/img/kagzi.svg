      <line x1="-16" y1="42" x2="-20" y2="64"/>
      <line x1="-42" y1="22" x2="-62" y2="32"/>
      <line x1="-48" y1="-8" x2="-72" y2="-12"/>
      <line x1="-30" y1="-36" x2="-44" y2="-54"/>
